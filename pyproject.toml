[project]
name = "hebrew-chapters"
version = "0.1.0"
description = "Auto-generate chapters, show notes, and pull-quotes for Hebrew podcasts (mp3/mp4) from a local transcript."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
chapters = "hebrew_chapters.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hebrew_chapters"]
