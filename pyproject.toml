[project]
name = "hebrew-chapters"
version = "0.1.0"
description = "Auto-generate chapters, show notes, and pull-quotes for Hebrew podcasts (mp3/mp4) from a local transcript."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
mcp = ["mcp>=1.0"]
youtube = ["yt-dlp>=2024.1"]
render = ["pillow>=10", "python-bidi>=0.4"]
crop = ["opencv-python-headless>=4.9"]  # face-aware crop centering (optional)

[project.scripts]
chapters = "hebrew_chapters.cli:main"
chapters-mcp = "hebrew_chapters.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hebrew_chapters"]
