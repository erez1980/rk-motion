<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RK Motion</title><style>
:root{--ink:#062f22;--green:#0a7d4d;--mint:#dff5e7;--line:#cce3d6;--paper:#f8fbf8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 Inter,ui-sans-serif,system-ui,sans-serif}.app{max-width:1180px;margin:auto;padding:28px}header{display:flex;align-items:center;gap:13px;margin-bottom:28px}header img{width:52px;height:52px;border-radius:50%}h1{margin:0;font-size:26px;letter-spacing:-.04em}header p{margin:0;color:#477064}.hero{border:2px dashed #83b99e;border-radius:22px;background:#fff;padding:42px;text-align:center;transition:.2s}.hero.over{background:var(--mint);border-color:var(--green)}.hero h2{margin:0 0 8px;font-size:20px}.button{display:inline-block;background:var(--green);color:white;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}.button.secondary{background:white;color:var(--green);border:1px solid var(--green)}input[type=file]{display:none}.status{display:none;margin:20px 0;padding:14px 16px;border-radius:10px;background:var(--mint)}.status.show{display:block}.progress{height:8px;background:#cce3d6;border-radius:9px;margin-top:10px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:var(--green);transition:width .15s}.workspace{display:none;grid-template-columns:minmax(0,1.2fr) minmax(320px,.8fr);gap:24px;margin-top:26px}.workspace.show{display:grid}video{width:100%;border-radius:16px;background:#111;max-height:62vh}.side{background:white;border:1px solid var(--line);border-radius:16px;padding:16px}.side h2{font-size:17px;margin:0 0 12px}.clip{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;border-top:1px solid #edf4ef;padding:11px 0}.clip strong{display:block}.clip small{color:#59756b}.clip input[type=number]{width:72px;padding:5px;border:1px solid var(--line);border-radius:6px}.actions{display:flex;gap:5px}.icon{border:1px solid var(--line);background:white;color:var(--green);border-radius:6px;padding:3px 7px;cursor:pointer}.footer{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px}.download{display:none}.error{background:#ffe6e1;color:#812d1b}@media(max-width:800px){.workspace.show{display:block}.side{margin-top:18px}.app{padding:18px}}
</style></head><body><main class="app"><header><img src="/assets/rk-logo.png"><div><h1>RK Motion</h1><p>Action highlights for riders · local and private</p></div></header>
<section id="drop" class="hero"><h2>Drop a ride video here</h2><p>RK Motion finds active scenes locally. Your video never leaves this Mac.</p><p><label for="maxLength">Max scene length (seconds, optional)</label> <input id="maxLength" type="number" min="1" step="1" placeholder="No limit"></p><label class="button" for="file">Choose video</label><input id="file" type="file" accept="video/*"></section>
<div id="status" class="status"><b id="statusText">Preparing…</b><div class="progress"><i id="bar"></i></div></div>
<section id="workspace" class="workspace"><div><video id="video" controls></video></div><aside class="side"><h2>Action suggestions <span id="count"></span></h2><div id="clips"></div><div class="footer"><button id="random" class="button secondary">Random order</button><button id="export" class="button">Export selected edit</button><a id="download" class="button download" download="RK-Motion-edit.mp4">Download MP4</a></div></aside></section></main>
<script>
const drop=document.querySelector('#drop'),file=document.querySelector('#file'),status=document.querySelector('#status'),bar=document.querySelector('#bar'),text=document.querySelector('#statusText'),workspace=document.querySelector('#workspace'),video=document.querySelector('#video'),clipsEl=document.querySelector('#clips');let report;
function setStatus(msg,p=0,error=false){status.className='status show'+(error?' error':'');text.textContent=msg;bar.style.width=p+'%'}
function upload(f){if(!f)return;setStatus('Uploading '+f.name+'…',0);const x=new XMLHttpRequest;x.open('POST','/api/analyse');x.setRequestHeader('X-Filename',encodeURIComponent(f.name));x.setRequestHeader('X-Max-Scene-Length',document.querySelector('#maxLength').value.trim());x.upload.onprogress=e=>{if(e.lengthComputable)setStatus('Uploading '+f.name+'…',Math.round(e.loaded/e.total*70))};x.onload=()=>{try{report=JSON.parse(x.responseText)}catch{report={error:'Unexpected response'}}if(report.error)return setStatus(report.error,0,true);setStatus('Analysis complete',100);show()};x.onerror=()=>setStatus('Could not analyse this video.',0,true);x.send(f)}
file.onchange=()=>upload(file.files[0]);['dragenter','dragover'].forEach(e=>drop.addEventListener(e,e=>{e.preventDefault();drop.classList.add('over')}));['dragleave','drop'].forEach(e=>drop.addEventListener(e,e=>{e.preventDefault();drop.classList.remove('over')}));drop.addEventListener('drop',e=>upload(e.dataTransfer.files[0]));
function fmt(v){v=Math.max(0,Number(v));return String(Math.floor(v/60)).padStart(2,'0')+':'+String(Math.floor(v%60)).padStart(2,'0')}
function show(){workspace.classList.add('show');video.src='/api/video/'+report.job_id;document.querySelector('#count').textContent='('+report.clips.length+')';render()}
function render(){clipsEl.innerHTML='';report.clips.forEach((c,i)=>{let row=document.createElement('div');row.className='clip';row.innerHTML=`<input type="checkbox" ${c.selected===false?'':'checked'}><div><strong>Action score ${Math.round(c.score*100)}%</strong><small><input aria-label="start" type="number" step=".1" value="${c.start}"> – <input aria-label="end" type="number" step=".1" value="${c.end}"> · ${fmt(c.duration)}</small></div><div class="actions"><button class="icon">▶</button><button class="icon">↑</button><button class="icon">↓</button></div>`;let [check,start,end]=row.querySelectorAll('input');check.onchange=()=>c.selected=check.checked;start.onchange=()=>{c.start=+start.value;c.duration=c.end-c.start};end.onchange=()=>{c.end=+end.value;c.duration=c.end-c.start};let bs=row.querySelectorAll('button');bs[0].onclick=()=>{video.currentTime=c.start;video.play()};bs[1].onclick=()=>move(i,-1);bs[2].onclick=()=>move(i,1);clipsEl.append(row)})}
function move(i,d){let j=i+d;if(j<0||j>=report.clips.length)return;[report.clips[i],report.clips[j]]=[report.clips[j],report.clips[i]];render()}
document.querySelector('#random').onclick=()=>{for(let i=report.clips.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[report.clips[i],report.clips[j]]=[report.clips[j],report.clips[i]]}render()};
document.querySelector('#export').onclick=async()=>{let chosen=report.clips.filter(c=>c.selected!==false);if(!chosen.length)return setStatus('Select at least one suggestion.',0,true);setStatus('Exporting your edited movie…',75);let r=await fetch('/api/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job_id:report.job_id,clips:chosen})}),d=await r.json();if(d.error)return setStatus(d.error,0,true);let a=document.querySelector('#download');a.href=d.download;a.classList.remove('download');setStatus('Your edit is ready.',100)};
</script></body></html>
