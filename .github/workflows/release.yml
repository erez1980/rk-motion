name: Build desktop apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v0.5.0); leave empty for a build-only run"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: RK-Motion-macOS-AppleSilicon
          - os: windows-latest
            artifact: RK-Motion-Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install .[lan] pyinstaller pillow

      - name: Bundle static FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p packaging/ffmpeg-bin
          # Patient retries: this is a third-party host, and a few minutes of
          # it being unavailable should not cost a release.
          curl -fL --retry 5 --retry-delay 10 --retry-all-errors -o /tmp/ffmpeg.zip  "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffmpeg.zip"
          curl -fL --retry 5 --retry-delay 10 --retry-all-errors -o /tmp/ffprobe.zip "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffprobe.zip"
          unzip -o /tmp/ffmpeg.zip  -d packaging/ffmpeg-bin
          unzip -o /tmp/ffprobe.zip -d packaging/ffmpeg-bin
          chmod +x packaging/ffmpeg-bin/ffmpeg packaging/ffmpeg-bin/ffprobe
          packaging/ffmpeg-bin/ffmpeg -version | head -1

      - name: Bundle static FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force packaging/ffmpeg-bin | Out-Null

          # BtbN is the source that works; it went 404 for minutes at a time on
          # two builds while its release assets were being replaced, so the
          # retry budget is what actually matters here — roughly five minutes
          # of patience rather than one. gyan.dev is a last resort that has
          # never had to run; if BtbN is up, nothing else is even contacted.
          function Fetch($url, $out, $retries, $delay) {
            curl.exe -fL --retry $retries --retry-delay $delay --retry-all-errors -o $out $url
            return ($LASTEXITCODE -eq 0)   # a native command's failure does not throw here
          }

          $btbn = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          if (Fetch $btbn "ffmpeg.zip" 10 30) {
            Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp -Force
          } else {
            Write-Host "::warning::BtbN unavailable, falling back to gyan.dev"
            if (-not (Fetch "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" "ffmpeg.zip" 5 20)) {
              throw "could not download FFmpeg from either source"
            }
            Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp -Force
          }

          $bin   = Get-ChildItem ffmpeg-tmp -Recurse -Filter ffmpeg.exe  | Select-Object -First 1
          $probe = Get-ChildItem ffmpeg-tmp -Recurse -Filter ffprobe.exe | Select-Object -First 1
          if (-not $bin -or -not $probe) { throw "the archive held no ffmpeg.exe/ffprobe.exe" }
          Copy-Item $bin.FullName   packaging/ffmpeg-bin/
          Copy-Item $probe.FullName packaging/ffmpeg-bin/
          packaging/ffmpeg-bin/ffmpeg.exe -version | Select-Object -First 1

      - name: Build with PyInstaller
        run: pyinstaller packaging/rk-motion.spec --noconfirm

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/RK Motion.app" "${{ matrix.artifact }}.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/RK Motion.exe" -DestinationPath "${{ matrix.artifact }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          # On manual runs the given tag is created at the built commit.
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: "*.zip"
          body: |
            ## RK Motion — desktop app

            Turn a long ride video into reviewed action clips and one exported
            highlight movie. Everything runs locally; nothing is uploaded.

            **Download:** pick the file for your computer below, unzip it and
            run it. FFmpeg is bundled — no other installs needed.

            ### First launch (the app is not code-signed yet)

            - **macOS:** right-click **RK Motion.app** → **Open** → **Open**.
              If macOS still refuses, allow it under **System Settings →
              Privacy & Security → Open Anyway** (one time only).
            - **Windows:** if SmartScreen shows "Windows protected your PC",
              click **More info → Run anyway** (one time only).

            The app opens your browser at a local address (127.0.0.1). Closing
            the app window/terminal stops it and deletes its temporary files.

            ---

            ### עברית — הפעלה ראשונה

            ההורדה: בוחרים את הקובץ המתאים למחשב, מחלצים ומריצים. FFmpeg כבר
            כלול — אין צורך בהתקנות נוספות.

            - **מק:** קליק ימני על **RK Motion.app** ← **פתיחה** ← **פתיחה**
              (פעם אחת בלבד, כי האפליקציה עדיין לא חתומה).
            - **Windows:** אם מופיעה אזהרת SmartScreen — **More info ←
              Run anyway** (פעם אחת בלבד).
