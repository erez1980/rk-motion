name: iPhone standalone
on:
  push:
    branches: [main, 'codex/**']
    paths: ['ios/**', 'scripts/build-ios.sh', 'scripts/generate-ios-project.py', 'scripts/check-ios-store.py', 'scripts/make-altstore-source.py', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', 'scripts/build-ios.sh', 'scripts/generate-ios-project.py', 'scripts/check-ios-store.py', 'scripts/make-altstore-source.py', '.github/workflows/ios.yml']
  workflow_dispatch:
concurrency:
  group: ios-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select supported App Store toolchain
        run: |
          test -d /Applications/Xcode_26.3.app
          echo "DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer" >> "$GITHUB_ENV"
      - name: Check App Store metadata
        run: python3 scripts/check-ios-store.py
      - name: Compile simulator app
        run: bash scripts/build-ios.sh simulator
      - name: Test local analysis and export on simulator
        run: |
          rk_sim=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for vs in d["devices"].values() for v in vs if v["name"].startswith("iPhone")))')
          xcodebuild -project ios/RKMotion.xcodeproj -scheme RKMotion -configuration Debug -destination "platform=iOS Simulator,id=$rk_sim" -derivedDataPath build/ios/Tests -resultBundlePath build/ios/TestResults.xcresult CODE_SIGNING_ALLOWED=NO test
      - name: Build unsigned iPhone IPA
        env:
          RK_BUILD_NUMBER: ${{ github.run_number }}
          RK_COMMIT: ${{ github.sha }}
        run: bash scripts/build-ios.sh unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: RK-Motion-unsigned-IPA
          path: build/ios/RK-Motion-*.ipa
          if-no-files-found: error

      - name: Preserve native test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RK-Motion-test-results
          path: build/ios/TestResults.xcresult
          if-no-files-found: ignore

  # Every green main build becomes a public GitHub Release with the IPA and a
  # SideStore/AltStore source, so the iPhone installs and updates on its own:
  # https://github.com/<repo>/releases/latest/download/source.json
  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ios-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RK-Motion-unsigned-IPA
          path: dist
      - name: Publish IPA and install source
        run: |
          rk_ipa=$(ls dist/RK-Motion-*.ipa)
          rk_name=$(basename "$rk_ipa" .ipa)
          rk_tag="v${rk_name#RK-Motion-}"
          rk_tag="${rk_tag%-*}"
          gh release create "$rk_tag" "$rk_ipa" --draft --target "$GITHUB_SHA" \
            --title "RK Motion ${rk_tag#v}" \
            --notes "Unsigned IPA from commit ${GITHUB_SHA:0:7}. Install on the iPhone through SideStore with the source https://github.com/$GH_REPO/releases/latest/download/source.json (see docs/IPHONE.md)."
          gh api "repos/$GH_REPO/releases?per_page=30" > dist/releases.json
          python3 scripts/make-altstore-source.py "$rk_ipa" dist/releases.json dist/source.json --repo "$GH_REPO" --tag "$rk_tag"
          gh release upload "$rk_tag" dist/source.json
          gh release edit "$rk_tag" --draft=false --latest
