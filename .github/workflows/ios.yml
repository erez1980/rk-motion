name: iPhone standalone
on:
  push:
    branches: [main, 'codex/**']
    paths: ['ios/**', 'scripts/build-ios.sh', 'scripts/generate-ios-project.py', 'scripts/check-ios-store.py', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', 'scripts/build-ios.sh', 'scripts/generate-ios-project.py', 'scripts/check-ios-store.py', '.github/workflows/ios.yml']
  workflow_dispatch:
concurrency:
  group: ios-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Select supported App Store toolchain
        run: |
          test -d /Applications/Xcode_26.3.app
          echo "DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer" >> "$GITHUB_ENV"
      - name: Check App Store metadata
        run: python3 scripts/check-ios-store.py
      - name: Compile simulator app
        run: bash scripts/build-ios.sh simulator
      - name: Keep YouTube out of the store build
        # Guideline 5.2.3 bars downloading from YouTube. The personal build must
        # carry the library; a build under the store's conditions must not hold
        # a byte of it. Checking both keeps the second check from passing only
        # because the library was never linked at all.
        run: |
          personal=build/ios/DerivedData/Build/Products/Release-iphonesimulator/RKMotion.app/RKMotion
          nm "$personal" | grep -q YouTubeKit || { echo "personal build lacks YouTubeKit"; exit 1; }
          # The store archive is built from this generated project; build it the
          # same way, minus signing, and inspect what it links.
          RK_STORE_PROJECT=1 python3 scripts/generate-ios-project.py
          xcodebuild -project ios/RKMotion-Store.xcodeproj -scheme RKMotion -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios/StoreConditions \
            CODE_SIGNING_ALLOWED=NO build
          store=build/ios/StoreConditions/Build/Products/Release-iphonesimulator/RKMotion.app/RKMotion
          test -f "$store"
          if nm "$store" | grep -q YouTubeKit; then echo "YouTubeKit symbols reached the store-condition binary"; nm "$store" | grep YouTubeKit | head; exit 1; fi
          if strings "$store" | grep -q 'youtubei/v1'; then echo "YouTube API endpoints reached the store-condition binary"; exit 1; fi
          echo "personal build carries YouTubeKit; the store project's build holds none of it"
      - name: Test local analysis and export on simulator
        run: |
          rk_sim=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for vs in d["devices"].values() for v in vs if v["name"].startswith("iPhone")))')
          xcodebuild -project ios/RKMotion.xcodeproj -scheme RKMotion -configuration Debug -destination "platform=iOS Simulator,id=$rk_sim" -derivedDataPath build/ios/Tests -resultBundlePath build/ios/TestResults.xcresult CODE_SIGNING_ALLOWED=NO test
      - name: Build unsigned iPhone IPA
        run: bash scripts/build-ios.sh unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: RK-Motion-unsigned-IPA
          path: build/ios/RK-Motion-unsigned.ipa
          if-no-files-found: error

      - name: Preserve native test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RK-Motion-test-results
          path: build/ios/TestResults.xcresult
          if-no-files-found: ignore
